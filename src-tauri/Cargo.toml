[package]
name = "personal-treasury"
version = "0.3.0-preview.1"
description = "Local-first personal treasury"
edition = "2021"
rust-version = "1.77"

[lib]
name = "personal_treasury_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2", "NSNotification", "NSDistributedNotificationCenter", "NSString", "NSOperation"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
