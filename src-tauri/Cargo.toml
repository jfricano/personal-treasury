[package]
name = "personal-treasury"
version = "0.2.1"
description = "Local-first personal treasury"
edition = "2021"
rust-version = "1.77"

[lib]
name = "personal_treasury_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
