name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Format, lint, types, unit + integration tests, desktop build and demo build.
      - run: npm run check
      # Playwright against the demo build, using the runner's installed Google Chrome.
      - run: npm run test:e2e:demo
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
